[package]
name = "ccusage-desktop"
version = "0.1.0"
description = "Desktop dashboard for Claude Code usage analytics"
authors = ["Saurabh Nemade"]
edition = "2021"

[lib]
name = "ccusage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time"] }
